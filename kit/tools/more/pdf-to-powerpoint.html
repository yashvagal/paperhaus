<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PDF to PowerPoint | BentoPDF</title>
    <meta name="description" content="Turn each PDF page into a PowerPoint slide, as a picture or as editable text. Runs in your browser." />
    <link rel="canonical" href="https://www.bentopdf.com/pdf-to-powerpoint" />
    <link href="/src/css/styles.css" rel="stylesheet" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
  </head>

  <body class="antialiased bg-gray-900">
    {{> navbar }}

    <main class="es-wrap">
      <button id="back-to-tools" class="flex items-center gap-2 text-indigo-300 hover:text-indigo-400 mb-4 font-semibold">
        <i data-lucide="arrow-left" class="cursor-pointer"></i>
        <span class="cursor-pointer">Back to Tools</span>
      </button>
      <h1 class="es-h1">PDF to PowerPoint</h1>
      <p class="es-sub" style="margin-top: 0.4rem; max-width: 42rem">
        Each page becomes a slide. Keep the exact look as pictures, or get editable text you can
        change in PowerPoint, Keynote or Google Slides. The page text also goes into the speaker
        notes. Nothing leaves this device.
      </p>

      <section class="es-card" style="margin-top: 1.2rem">
        <label id="mt-drop" class="es-drop" for="mt-file">
          <i class="ph ph-file-pdf"></i>
          <strong>Choose a PDF or drop it here</strong>
          <span class="es-sub">Up to 300 pages.</span>
          <input id="mt-file" type="file" accept="application/pdf,.pdf" hidden />
        </label>
        <div id="mt-doc" class="hidden">
          <div class="es-row">
            <i class="ph ph-file-pdf" style="font-size: 1.6rem; color: var(--es-accent)"></i>
            <div style="flex: 1; min-width: 0">
              <div id="mt-name" style="font-weight: 700; word-break: break-all"></div>
              <div id="mt-info" class="es-sub"></div>
            </div>
            <button id="mt-change" class="es-btn es-small" type="button">Change</button>
          </div>
          <div id="mt-thumbs" class="mt-grid" style="margin-top: 1rem"></div>
        </div>
      </section>

      <section class="es-card">
        <div class="mt-opts">
          <div>
            <div class="mt-opt-title">Slides</div>
            <div class="mt-seg">
              <label><input type="radio" name="mode" value="editable" checked /><span>Editable text<small>Text boxes over the page background</small></span></label>
              <label><input type="radio" name="mode" value="picture" /><span>Pictures<small>Exactly like the PDF, not editable</small></span></label>
            </div>
          </div>
          <div>
            <div class="mt-opt-title">Slide size</div>
            <div class="mt-seg">
              <label><input type="radio" name="size" value="match" checked /><span>Same as the PDF</span></label>
              <label><input type="radio" name="size" value="wide" /><span>Widescreen 16:9</span></label>
              <label><input type="radio" name="size" value="standard" /><span>Standard 4:3</span></label>
            </div>
          </div>
          <label class="es-check-row"><input id="mt-notes" type="checkbox" checked /> Put each page's text in the speaker notes</label>
          <div class="es-row">
            <button id="mt-go" class="es-btn es-primary" type="button" disabled><i class="ph ph-presentation-chart"></i> Convert to PowerPoint</button>
          </div>
        </div>
      </section>
    </main>

    <div id="mt-busy" class="es-busy hidden"><div class="es-busy-card"><div class="es-spin"></div><span id="mt-busy-text">Working...</span><div id="mt-busy-bar" class="mt-bar hidden"></div></div></div>
    <div id="mt-toast" class="es-toast hidden" role="status" aria-live="polite"></div>
    <div id="alert-modal" class="hidden"><div id="alert-title"></div><div id="alert-message"></div><button id="alert-ok"></button></div>
    <div id="loader-modal" class="hidden"><div id="loader-text"></div></div>

    {{> footer }}
    <script type="module" src="/src/js/utils/lucide-init.ts"></script>
    <script type="module" src="/src/js/utils/full-width.ts"></script>
    <script type="module" src="/src/js/utils/simple-mode-footer.ts"></script>
    <script type="module" src="/src/js/logic/kit-more/pptx-page.ts"></script>
    <script type="module" src="/src/js/mobileMenu.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>
  </body>
</html>
