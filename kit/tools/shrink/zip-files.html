<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ZIP Files | BentoPDF</title>
    <meta name="ph-done" content="compact" />
    <meta name="description" content="Put files in a ZIP, or open a ZIP and take files out, on your device." />
    <link href="/src/css/styles.css" rel="stylesheet" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
  </head>

  <body class="antialiased bg-gray-900">
    {{> navbar }}

    <main class="es-wrap">
      <button id="back-to-tools" class="flex items-center gap-2 text-indigo-300 hover:text-indigo-400 mb-4 font-semibold">
        <i data-lucide="arrow-left" class="cursor-pointer"></i>
        <span class="cursor-pointer">Back to Tools</span>
      </button>
      <h1 class="es-h1">ZIP Files</h1>
      <p class="es-sub" style="margin-top: 0.4rem; max-width: 42rem">Put several files into one ZIP to send them together, or open a ZIP someone sent you and take the files out. Nothing is uploaded.</p>

      <section class="es-card" style="margin-top: 1.2rem">
        <label id="mt-drop" class="es-drop" for="mt-file">
          <i class="ph ph-file-zip"></i>
          <strong>Choose files or a ZIP, or drop them here</strong>
          <span class="sh-drop-sub">Any files. Add a .zip to open it.</span>
          <input id="mt-file" type="file" accept="*/*" multiple hidden />
        </label>
        <div id="sh-files" class="hidden">
          <div class="sh-files-head"><h2>Your files</h2><button id="sh-clear" class="es-linkbtn" type="button">Clear all</button></div>
          <div id="sh-list" class="sh-list"></div>
        </div>
      </section>

      <section class="es-card">
        <div class="sh-opts">
          <div>
            <div class="mt-opt-title">What to do</div>
            <div class="mt-seg">
              <label><input type="radio" name="zmode" value="make" checked /><span>Make a ZIP<small>All files in one</small></span></label>
              <label><input type="radio" name="zmode" value="open" /><span>Open a ZIP<small>Take the files out</small></span></label>
            </div>
          </div>
          <div id="sh-zip-name-box">
            <div class="mt-opt-title">Name of the ZIP</div>
            <input id="sh-zip-name" class="es-input" type="text" maxlength="80" placeholder="Files" style="max-width: 20rem" />
          </div>
          <div class="es-row">
            <button id="sh-go" class="es-btn es-primary" type="button" disabled><i class="ph ph-file-zip"></i> Make the ZIP</button>
            <span id="sh-hint" class="es-sub"></span>
          </div>
        </div>
      </section>

      <section id="sh-done" class="es-card hidden">
        <div class="sh-done">
          <div><div class="es-sub">Done</div><strong id="sh-total"></strong></div>
          <button id="sh-all" class="es-btn es-primary" type="button"></button>
        </div>
        <p class="sh-help">Files you download are kept in My documents too.</p>
      </section>
    </main>

    <div id="mt-busy" class="es-busy hidden"><div class="es-busy-card"><div class="es-spin"></div><span id="mt-busy-text">Working...</span><div id="mt-busy-bar" class="mt-bar hidden"></div></div></div>
    <div id="mt-toast" class="es-toast hidden" role="status" aria-live="polite"></div>
    <div id="alert-modal" class="hidden"><div id="alert-title"></div><div id="alert-message"></div><button id="alert-ok"></button></div>
    <div id="loader-modal" class="hidden"><div id="loader-text"></div></div>

    {{> footer }}
    <script type="module" src="/src/js/utils/lucide-init.ts"></script>
    <script type="module" src="/src/js/utils/full-width.ts"></script>
    <script type="module" src="/src/js/utils/simple-mode-footer.ts"></script>
    <script type="module" src="/src/js/logic/kit-shrink/zip-page.ts"></script>
    <script type="module" src="/src/js/mobileMenu.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>
  </body>
</html>
